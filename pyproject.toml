[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ble-calibration"
version = "0.8.0"
description = "Windows desktop calibration tool for BLE digital keys"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [{name = "BLE Calibration Team"}]
dependencies = [
  "PySide6==6.7.3",
  "pyqtgraph==0.13.7",
]

[project.optional-dependencies]
can-windows = [
  "python-can==4.6.1",
  "zlgcan==0.3.0",
]

[project.scripts]
ble-calibration = "ble_calibration.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ble_calibration*"]
